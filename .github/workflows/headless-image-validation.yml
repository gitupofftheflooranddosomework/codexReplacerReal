name: Headless image validation

on:
  pull_request:
    paths:
      - 'lab/build-ci-headless-base.sh'
      - 'lab/codex-ci-headless.py'
      - 'lab/headless-template-identity-test.py'
      - '.github/workflows/headless-image-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate headless image builder and allocator contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n lab/build-ci-headless-base.sh
          python3 -m py_compile lab/codex-ci-headless.py lab/headless-template-identity-test.py
          python3 lab/headless-template-identity-test.py
