name: Headless image validation

on:
  pull_request:
    paths:
      - 'lab/build-ci-headless-base.sh'
      - 'lab/codex-ci-headless.py'
      - 'lab/headless-job-scheduler.py'
      - 'lab/headless-job-scheduler-test.py'
      - 'lab/headless-job-runner.py'
      - 'lab/headless-private-repo-auth-test.py'
      - 'lab/headless-rollout-admission-test.py'
      - 'lab/rollout_admission.py'
      - 'lab/serverworkerfabric-headless-manager.py'
      - 'lab/serverworkerfabric-headless-manager-test.py'
      - 'lab/headless-template-identity-test.py'
      - '.github/workflows/headless-image-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Owned Fabric capacity only. If it is unavailable this job must remain
    # queued; never fall back to GitHub-hosted or paid runners.
    runs-on: [self-hosted, serverworkerfabric, lxc, build]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate headless image builder and allocator contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n lab/build-ci-headless-base.sh
          python3 -m py_compile \
            lab/codex-ci-headless.py \
            lab/headless-template-identity-test.py \
            lab/headless-job-scheduler.py \
            lab/headless-job-scheduler-test.py \
            lab/headless-job-runner.py \
            lab/headless-private-repo-auth-test.py \
            lab/headless-rollout-admission-test.py \
            lab/rollout_admission.py \
            lab/serverworkerfabric-headless-manager.py \
            lab/serverworkerfabric-headless-manager-test.py
          python3 lab/headless-template-identity-test.py
          python3 lab/headless-job-scheduler-test.py
          python3 lab/headless-private-repo-auth-test.py
          python3 lab/headless-rollout-admission-test.py
          python3 lab/serverworkerfabric-headless-manager-test.py
